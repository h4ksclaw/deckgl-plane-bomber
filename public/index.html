<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAIJU CRUSH 🦖</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; cursor: crosshair; }
    #map { width: 100vw; height: 100vh; }

    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 5;
    }

    #hud {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 10;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #hud h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    #score {
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      transition: transform 0.1s;
    }
    #score.pop { transform: scale(1.2); }
    #combo {
      font-size: 18px;
      font-weight: 700;
      color: #ff6b35;
      min-height: 24px;
    }
    #stats {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.8;
    }

    #hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .screen-shake {
      animation: shake 0.3s ease-out;
    }
    @keyframes shake {
      0%, 100% { transform: translate(0,0); }
      20% { transform: translate(-8px, 4px); }
      40% { transform: translate(6px, -6px); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(3px, -3px); }
    }

    .flash {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(255, 150, 50, 0.3);
      pointer-events: none;
      z-index: 4;
      animation: flash 0.2s ease-out forwards;
    }
    @keyframes flash {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="particles"></canvas>

  <div id="hud">
    <h1>🦖 KAIJU CRUSH</h1>
    <div id="score">0</div>
    <div id="combo"></div>
    <div id="stats">Buildings destroyed: <span id="destroyed-count">0</span></div>
  </div>

  <div id="hint">🖱️ Click buildings to destroy them • Scroll to zoom • Drag to move</div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
  // ============================================================
  // AUDIO ENGINE — procedural explosion sounds
  // ============================================================
  var audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function generateExplosion(height) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var scale = Math.min(1, Math.max(0.3, height / 150)); // 0.3 for small, 1.0 for massive

    // 1. Sub-bass thump — deep impact
    var osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(80 * scale, t);
    osc.frequency.exponentialRampToValueAtTime(20, t + 0.3);
    var subGain = audioCtx.createGain();
    subGain.gain.setValueAtTime(0.8 * scale, t);
    subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(subGain);
    subGain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.4);

    // 2. Noise burst — the crunch/bang
    var noiseLen = Math.floor(audioCtx.sampleRate * (0.15 + scale * 0.25));
    var noiseBuf = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
    var noiseData = noiseBuf.getChannelData(0);
    for (var i = 0; i < noiseLen; i++) {
      noiseData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (noiseLen * 0.15));
    }
    var noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuf;
    // Lowpass for heavy rumble (lower = heavier)
    var lpf = audioCtx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.setValueAtTime(800 + scale * 1200, t);
    lpf.frequency.exponentialRampToValueAtTime(200, t + 0.3);
    var noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.7 * scale, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.2 + scale * 0.2);
    noiseSrc.connect(lpf);
    lpf.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noiseSrc.start(t);

    // 3. Mid-range boom
    var osc2 = audioCtx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(150, t);
    osc2.frequency.exponentialRampToValueAtTime(40, t + 0.2);
    var boomGain = audioCtx.createGain();
    boomGain.gain.setValueAtTime(0.5 * scale, t);
    boomGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    osc2.connect(boomGain);
    boomGain.connect(audioCtx.destination);
    osc2.start(t);
    osc2.stop(t + 0.25);

    // 4. Rumble tail — shaking debris
    var rumbleLen = Math.floor(audioCtx.sampleRate * (0.5 + scale * 0.8));
    var rumbleBuf = audioCtx.createBuffer(1, rumbleLen, audioCtx.sampleRate);
    var rumbleData = rumbleBuf.getChannelData(0);
    for (var j = 0; j < rumbleLen; j++) {
      // Brown noise with envelope
      var last = j > 0 ? rumbleData[j-1] : 0;
      rumbleData[j] = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
    }
    var rumbleSrc = audioCtx.createBufferSource();
    rumbleSrc.buffer = rumbleBuf;
    var bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 100 + scale * 80;
    bp.Q.value = 0.8;
    var rumbleGain = audioCtx.createGain();
    rumbleGain.gain.setValueAtTime(0.4 * scale, t + 0.05);
    rumbleGain.gain.exponentialRampToValueAtTime(0.001, t + 0.5 + scale * 0.5);
    rumbleSrc.connect(bp);
    bp.connect(rumbleGain);
    rumbleGain.connect(audioCtx.destination);
    rumbleSrc.start(t + 0.05);

    // 5. Glass/debris shimmer (random chance, adds realism)
    if (Math.random() > 0.3) {
      var glassLen = Math.floor(audioCtx.sampleRate * 0.4);
      var glassBuf = audioCtx.createBuffer(1, glassLen, audioCtx.sampleRate);
      var glassData = glassBuf.getChannelData(0);
      for (var k = 0; k < glassLen; k++) {
        // High freq noise with fast decay
        glassData[k] = (Math.random() * 2 - 1) * Math.exp(-k / (glassLen * 0.08));
      }
      var glassSrc = audioCtx.createBufferSource();
      glassSrc.buffer = glassBuf;
      var hpf = audioCtx.createBiquadFilter();
      hpf.type = 'highpass';
      hpf.frequency.value = 2000 + Math.random() * 3000;
      var glassGain = audioCtx.createGain();
      glassGain.gain.setValueAtTime(0.15 * scale, t);
      glassGain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      glassSrc.connect(hpf);
      hpf.connect(glassGain);
      glassGain.connect(audioCtx.destination);
      glassSrc.start(t);
    }

    // 6. Echo/reverb — distant feel for large buildings
    if (scale > 0.6) {
      var echoDelay = 0.15 + Math.random() * 0.1;
      var echoOsc = audioCtx.createOscillator();
      echoOsc.type = 'sine';
      echoOsc.frequency.setValueAtTime(50, t + echoDelay);
      echoOsc.frequency.exponentialRampToValueAtTime(20, t + echoDelay + 0.5);
      var echoGain = audioCtx.createGain();
      echoGain.gain.setValueAtTime(0.001, t);
      echoGain.gain.linearRampToValueAtTime(0.25 * scale, t + echoDelay);
      echoGain.gain.exponentialRampToValueAtTime(0.001, t + echoDelay + 0.6);
      echoOsc.connect(echoGain);
      echoGain.connect(audioCtx.destination);
      echoOsc.start(t + echoDelay);
      echoOsc.stop(t + echoDelay + 0.6);
    }
  }

  function playCombo(level) {
    if (!audioCtx) return;
    // Quick ascending tone for combo feedback
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400 + level * 120, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800 + level * 200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  // Procedural fire crackle loop
  var fireGainNode = null;
  function startFireSound() {
    if (!audioCtx || fireGainNode) return;
    fireGainNode = audioCtx.createGain();
    fireGainNode.gain.value = 0;
    fireGainNode.connect(audioCtx.destination);

    // Brown noise for rumble
    var bufSize = audioCtx.sampleRate * 2;
    var buf = audioCtx.createBuffer(2, bufSize, audioCtx.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var data = buf.getChannelData(ch);
      var last = 0;
      for (var i = 0; i < bufSize; i++) {
        var white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        data[i] = last * 3.5;
      }
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    // Bandpass for crackle character
    var bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 800;
    bp.Q.value = 0.5;

    src.connect(bp);
    bp.connect(fireGainNode);
    src.start();

    // Fade in
    fireGainNode.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 1);
  }

  function stopFireSound() {
    if (!fireGainNode || !audioCtx) return;
    fireGainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
    setTimeout(function() { fireGainNode = null; }, 1500);
  }

  // ============================================================
  // PARTICLE SYSTEM — debris and explosions
  // ============================================================
  var particleCanvas = document.getElementById('particles');
  var pctx = particleCanvas.getContext('2d');
  var particles = [];

  function resizeParticleCanvas() {
    particleCanvas.width = window.innerWidth;
    particleCanvas.height = window.innerHeight;
  }
  resizeParticleCanvas();
  window.addEventListener('resize', resizeParticleCanvas);

  function spawnExplosion(screenX, screenY, buildingColor, intensity) {
    // Structural chunks — large pieces of the building falling apart
    var chunkCount = 8 + Math.floor(intensity / 15);
    for (var i = 0; i < chunkCount; i++) {
      var angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2;
      var speed = 3 + Math.random() * 5 * (1 + intensity / 150);
      var w = 6 + Math.random() * 14;
      var h = 4 + Math.random() * (intensity / 8);
      particles.push({
        x: screenX + (Math.random() - 0.5) * 20,
        y: screenY + (Math.random() - 0.5) * 10,
        vx: Math.cos(angle) * speed * (Math.random() > 0.5 ? 1 : -1),
        vy: Math.sin(angle) * speed - Math.random() * 2,
        w: w,
        h: h,
        color: buildingColor || '#b0a89c',
        life: 1,
        decay: 0.006 + Math.random() * 0.008,
        gravity: 0.35,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 15,
        type: 'chunk',
        bounce: 0.3 + Math.random() * 0.2,
      });
    }
    // Small debris — bits and pieces
    var debrisCount = 15 + Math.floor(intensity * 0.2);
    for (var j = 0; j < debrisCount; j++) {
      var a2 = Math.random() * Math.PI * 2;
      var sp2 = 1 + Math.random() * 7;
      particles.push({
        x: screenX + (Math.random() - 0.5) * 30,
        y: screenY,
        vx: Math.cos(a2) * sp2,
        vy: Math.sin(a2) * sp2 - Math.random() * 4,
        size: 1.5 + Math.random() * 3,
        color: buildingColor || '#b0a89c',
        life: 1,
        decay: 0.012 + Math.random() * 0.015,
        gravity: 0.25,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 12,
        type: 'debris',
        bounce: 0.2,
      });
    }
    // Dust cloud — expands and fades
    for (var k = 0; k < 12; k++) {
      particles.push({
        x: screenX + (Math.random() - 0.5) * 30,
        y: screenY + (Math.random() - 0.5) * 15,
        vx: (Math.random() - 0.5) * 4,
        vy: -1 - Math.random() * 3,
        size: 15 + Math.random() * 25,
        color: 'rgba(160,150,140,',
        life: 1,
        decay: 0.01 + Math.random() * 0.008,
        gravity: -0.03,
        type: 'dust',
      });
    }
    // Embers / sparks
    for (var m = 0; m < 8; m++) {
      var a3 = -Math.PI / 2 + (Math.random() - 0.5) * 1;
      particles.push({
        x: screenX + (Math.random() - 0.5) * 15,
        y: screenY,
        vx: Math.cos(a3) * (2 + Math.random() * 3),
        vy: -3 - Math.random() * 5,
        size: 1 + Math.random() * 2,
        color: Math.random() > 0.5 ? '#ff6a00' : '#ffaa00',
        life: 1,
        decay: 0.02 + Math.random() * 0.02,
        gravity: -0.05,
        type: 'ember',
      });
    }
  }

  function updateParticles() {
    pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
    var groundY = particleCanvas.height;
    var alive = [];
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.99;
      p.life -= p.decay;
      p.rotation += p.rotSpeed;

      // Ground bounce for chunks and debris
      if (p.type === 'chunk' || p.type === 'debris') {
        if (p.y > groundY - 10) {
          p.y = groundY - 10;
          p.vy *= -p.bounce;
          p.vx *= 0.8;
          p.rotSpeed *= 0.7;
          // Spawn tiny impact dust
          if (Math.abs(p.vy) > 1) {
            particles.push({
              x: p.x,
              y: groundY - 5,
              vx: (Math.random() - 0.5) * 2,
              vy: -Math.random() * 1.5,
              size: 5 + Math.random() * 8,
              color: 'rgba(140,130,120,',
              life: 0.6,
              decay: 0.03,
              gravity: 0.02,
              type: 'dust',
            });
          }
        }
      }

      if (p.life <= 0) continue;
      alive.push(p);

      pctx.save();
      pctx.globalAlpha = Math.min(1, p.life * 1.5);

      if (p.type === 'dust') {
        pctx.fillStyle = p.color + (p.life * 0.4) + ')';
        pctx.beginPath();
        pctx.arc(p.x, p.y, p.size * (2 - p.life), 0, Math.PI * 2);
        pctx.fill();
      } else if (p.type === 'ember') {
        pctx.fillStyle = p.color;
        pctx.shadowColor = p.color;
        pctx.shadowBlur = 6;
        pctx.beginPath();
        pctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        pctx.fill();
      } else if (p.type === 'chunk') {
        pctx.translate(p.x, p.y);
        pctx.rotate(p.rotation * Math.PI / 180);
        // Chunk with slight 3D shading
        pctx.fillStyle = p.color;
        pctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        // Darker edge for depth
        pctx.fillStyle = 'rgba(0,0,0,0.2)';
        pctx.fillRect(-p.w / 2, 0, p.w, p.h / 2);
        // Light edge
        pctx.fillStyle = 'rgba(255,255,255,0.15)';
        pctx.fillRect(-p.w / 2, -p.h / 2, p.w, 2);
      } else {
        // debris
        pctx.translate(p.x, p.y);
        pctx.rotate(p.rotation * Math.PI / 180);
        pctx.fillStyle = p.color;
        pctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      }
      pctx.restore();
    }
    particles = alive;
    requestAnimationFrame(updateParticles);
  }
  updateParticles();

  // ============================================================
  // GAME STATE
  // ============================================================
  var score = 0;
  var destroyed = new Set(); // set of destroyed building IDs
  var comboCount = 0;
  var comboTimer = null;
  var destroyedCount = 0;

  var scoreEl = document.getElementById('score');
  var comboEl = document.getElementById('combo');
  var destroyedEl = document.getElementById('destroyed-count');

  function addScore(height, screenX, screenY) {
    // Bigger buildings = more points
    var points = Math.max(10, Math.floor(height / 3));

    // Combo system
    comboCount++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function() { comboCount = 0; comboEl.textContent = ''; }, 1500);

    if (comboCount > 1) {
      var multiplier = Math.min(comboCount, 5);
      points *= multiplier;
      comboEl.textContent = '🔥 ' + comboCount + 'x COMBO! (x' + multiplier + ')';
      playCombo(comboCount);
    }

    score += points;
    destroyedCount++;

    scoreEl.textContent = score.toLocaleString();
    scoreEl.classList.add('pop');
    setTimeout(function() { scoreEl.classList.remove('pop'); }, 100);
    destroyedEl.textContent = destroyedCount;

    // Floating score text
    var floater = document.createElement('div');
    floater.textContent = '+' + points;
    floater.style.cssText = 'position:fixed;left:' + screenX + 'px;top:' + screenY + 'px;color:#ff6b35;font-size:20px;font-weight:800;pointer-events:none;z-index:10;text-shadow:0 2px 4px rgba(0,0,0,0.8);transition:all 0.8s ease-out;';
    document.body.appendChild(floater);
    requestAnimationFrame(function() {
      floater.style.transform = 'translateY(-60px)';
      floater.style.opacity = '0';
    });
    setTimeout(function() { floater.remove(); }, 800);
  }

  // ============================================================
  // MAP SETUP
  // ============================================================
  var KEY = 'RaeBK7ZUPMGsXQd8JMzu';
  var STYLE_URL = 'https://api.maptiler.com/maps/satellite/style.json?key=' + KEY;

  var map = new maplibregl.Map({
    container: 'map',
    style: STYLE_URL,
    center: [-73.9857, 40.7484],
    zoom: 15.5,
    pitch: 55,
    bearing: -30,
    maxZoom: 22,
    maxPitch: 85,
    doubleClickZoom: false,
  });

  // Disable double-click zoom — it conflicts with rapid clicking
  map.doubleClickZoom.disable();

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

  map.on('styleimagemissing', function(e) {
    map.addImage(e.id, { width: 1, height: 1, data: new Uint8Array([0,0,0,0]) });
  });

  // Track destroyed buildings in a GeoJSON source for rubble
  var rubbleFeatures = { type: 'FeatureCollection', features: [] };

  function add3DLayers() {
    if (!map.getSource('terrain')) {
      map.addSource('terrain', {
        type: 'raster-dem',
        url: 'https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=' + KEY,
      });
      map.setTerrain({ source: 'terrain', exaggeration: 1.5 });
    }

    if (!map.getSource('buildings')) {
      map.addSource('buildings', {
        type: 'vector',
        url: 'https://api.maptiler.com/tiles/v3/tiles.json?key=' + KEY,
      });
    }

    if (!map.getLayer('3d-buildings')) {
      map.addLayer({
        id: '3d-buildings',
        type: 'fill-extrusion',
        source: 'buildings',
        'source-layer': 'building',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': [
            'case',
            ['==', ['get', 'colour'], 'white'],    '#f0ece8',
            ['==', ['get', 'colour'], 'beige'],    '#e8dcc8',
            ['==', ['get', 'colour'], 'red'],      '#b55a5a',
            ['==', ['get', 'colour'], 'brown'],    '#8b6f5e',
            ['==', ['get', 'colour'], 'green'],    '#7a9a6d',
            ['==', ['get', 'colour'], 'black'],    '#3a3a3a',
            ['==', ['get', 'colour'], 'darkgray'], '#6b6b6b',
            ['==', ['get', 'colour'], 'lightgray'],'#d0d0d0',
            ['has', 'colour'],
              ['to-color', ['get', 'colour'], '#b0a89c'],
            ['interpolate', ['linear'], ['get', 'render_height'],
              0, '#c8c0b4', 30, '#b0a89c', 80, '#9a9088', 150, '#847c74', 300, '#6e6862',
            ],
          ],
          'fill-extrusion-height': ['get', 'render_height'],
          'fill-extrusion-base': ['get', 'render_min_height'],
          'fill-extrusion-opacity': 0.95,
        },
      });
    }

    // Rubble layer — flat footprint marker where buildings were destroyed
    if (!map.getSource('rubble')) {
      map.addSource('rubble', {
        type: 'geojson',
        data: rubbleFeatures,
      });
    }
    if (!map.getLayer('rubble-layer')) {
      map.addLayer({
        id: 'rubble-layer',
        type: 'fill',
        source: 'rubble',
        paint: {
          'fill-color': '#333',
          'fill-opacity': 0.4,
          'fill-outline-color': '#555',
        },
      });
    }

    // Fire — 3D extruded columns that occlude properly
    if (!map.getSource('fires')) {
      map.addSource('fires', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
      });
    }
    // Outer fire glow
    if (!map.getLayer('fire-glow')) {
      map.addLayer({
        id: 'fire-glow',
        type: 'fill-extrusion',
        source: 'fires',
        paint: {
          'fill-extrusion-color': '#ff3300',
          'fill-extrusion-height': ['get', 'fireHeight'],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.2,
        },
      });
    }
    // Fire core — brighter, smaller inner column
    if (!map.getLayer('fire-core')) {
      map.addLayer({
        id: 'fire-core',
        type: 'fill-extrusion',
        source: 'fires',
        paint: {
          'fill-extrusion-color': '#ffcc00',
          'fill-extrusion-height': ['*', ['get', 'fireHeight'], 0.7],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.5,
        },
      });
    }
    // Smoke — 3D extruded columns rising from fires
    if (!map.getSource('smoke')) {
      map.addSource('smoke', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
      });
    }
    if (!map.getLayer('smoke-layer')) {
      map.addLayer({
        id: 'smoke-layer',
        type: 'fill-extrusion',
        source: 'smoke',
        paint: {
          'fill-extrusion-color': ['get', 'smokeColor'],
          'fill-extrusion-height': ['get', 'smokeHeight'],
          'fill-extrusion-base': ['get', 'smokeBase'],
          'fill-extrusion-opacity': 0.2,
        },
      });
    }
  }

  // Helper: create a small GeoJSON polygon (box) around a point
  function makeBox(cx, cy, size) {
    var s = size;
    return {
      type: 'Polygon',
      coordinates: [[
        [cx - s, cy - s],
        [cx + s, cy - s],
        [cx + s, cy + s],
        [cx - s, cy + s],
        [cx - s, cy - s],
      ]],
    };
  }

  // Terrain zoom adjustment
  map.on('zoom', function() {
    var z = map.getZoom();
    var exag = z > 15 ? Math.max(0.3, 1.5 - (z - 15) * 0.25) : 1.5;
    if (map.getSource('terrain')) {
      map.setTerrain({ source: 'terrain', exaggeration: exag });
    }
  });

  map.on('load', add3DLayers);

  // Animate fire — flickering 3D columns + rising smoke
  var fireTime = 0;
  var smokeColumns = [];
  var fireLocations = []; // track [lng, lat, baseHeight, boxSize] for each fire

  function spawnSmokePuff(fire) {
    var s = fire.boxSize * (0.6 + Math.random() * 0.8);
    smokeColumns.push({
      cx: fire.lng + (Math.random() - 0.5) * s * 3,
      cy: fire.lat + (Math.random() - 0.5) * s * 3,
      baseHeight: 0,
      topHeight: 2 + Math.random() * 5,
      rise: 0.15 + Math.random() * 0.25,
      drift: (Math.random() - 0.5) * 0.0000002,
      size: s,
      growRate: 0.00000015 + Math.random() * 0.0000002,
      opacity: 0.25 + Math.random() * 0.15,
      life: 1,
      decay: 0.002 + Math.random() * 0.003,
    });
  }

  function updateFireSystem() {
    var smokeSrc = map.getSource('smoke');
    var fireSrc = map.getSource('fires');
    fireTime += 1;

    // Rebuild fire GeoJSON with animated heights
    if (fireSrc && fireLocations.length > 0) {
      var fireFeatures = [];
      for (var f = 0; f < fireLocations.length; f++) {
        var fl = fireLocations[f];
        // Flickering height — multiple sine waves for organic feel
        var h = fl.baseH
          + Math.sin(fireTime * 0.06 + f * 2.1) * (fl.baseH * 0.25)
          + Math.sin(fireTime * 0.15 + f * 0.7) * (fl.baseH * 0.12)
          + Math.random() * (fl.baseH * 0.08);
        h = Math.max(3, h);

        fireFeatures.push({
          type: 'Feature',
          properties: { fireHeight: h },
          geometry: makeBox(fl.lng, fl.lat, fl.boxSize),
        });

        // Spawn smoke puffs
        if (Math.random() > 0.4 && smokeColumns.length < 120) {
          spawnSmokePuff(fl);
        }

        // Spawn canvas embers at screen position
        if (Math.random() > 0.6) {
          var sp = map.project(new maplibregl.LngLat(fl.lng, fl.lat));
          if (sp) {
            particles.push({
              x: sp.x + (Math.random() - 0.5) * 30,
              y: sp.y - Math.random() * 40,
              vx: (Math.random() - 0.5) * 2.5,
              vy: -1.5 - Math.random() * 4,
              size: 1 + Math.random() * 2.5,
              color: ['#ff4400','#ff7700','#ffaa00','#ffcc33'][Math.floor(Math.random()*4)],
              life: 1,
              decay: 0.02 + Math.random() * 0.025,
              gravity: -0.04,
              rotation: 0, rotSpeed: 0,
              type: 'ember',
            });
          }
        }
      }
      fireSrc.setData({ type: 'FeatureCollection', features: fireFeatures });
    }

    // Update smoke columns
    if (smokeSrc) {
      var alive = [];
      for (var i = 0; i < smokeColumns.length; i++) {
        var p = smokeColumns[i];
        p.topHeight += p.rise;
        p.baseHeight += p.rise * 0.5; // hollow column — base rises slower
        p.cx += p.drift;
        p.size += p.growRate;
        p.life -= p.decay;
        if (p.life <= 0 || p.baseHeight > 120) continue;
        alive.push(p);
      }
      smokeColumns = alive;
      if (smokeColumns.length > 120) smokeColumns = smokeColumns.slice(-120);

      var smokeFeatures = [];
      for (var j = 0; j < smokeColumns.length; j++) {
        var sc = smokeColumns[j];
        var g = Math.floor(25 + (1 - sc.life) * 50);
        smokeFeatures.push({
          type: 'Feature',
          properties: {
            smokeColor: 'rgb(' + g + ',' + g + ',' + g + ')',
            smokeHeight: sc.topHeight,
            smokeBase: sc.baseHeight,
          },
          geometry: makeBox(sc.cx, sc.cy, sc.size),
        });
      }
      smokeSrc.setData({ type: 'FeatureCollection', features: smokeFeatures });
    }
  }

  function animateFire() {
    updateFireSystem();
    requestAnimationFrame(animateFire);
  }
  // Start animation after map loads
  map.on('load', function() {
    setTimeout(animateFire, 500);
  });

  // ============================================================
  // BUILDING DESTRUCTION
  // ============================================================
  map.on('click', function(e) {
    initAudio();

    // Don't process clicks while layer isn't ready
    if (!map.getLayer('3d-buildings')) return;

    var features = map.queryRenderedFeatures(e.point, {
      layers: ['3d-buildings'],
    });

    if (features.length === 0) return;

    var building = features[0];
    var props = building.properties || {};
    var height = props.render_height || 30;
    var geom = building.geometry;
    var id = building.id;

    // Don't destroy the same building twice
    if (destroyed.has(id)) return;
    destroyed.add(id);

    // Get building color for particles
    var color = props.colour;
    if (!color || ['white','beige','black','red','brown','green','darkgray','lightgray'].indexOf(color) !== -1) {
      var colorMap = { white:'#f0ece8', beige:'#e8dcc8', red:'#b55a5a', brown:'#8b6f5e', green:'#7a9a6d', black:'#3a3a3a', darkgray:'#6b6b6b', lightgray:'#d0d0d0' };
      color = colorMap[color] || '#b0a89c';
    }

    // Spawn explosion at click point
    spawnExplosion(e.originalEvent.clientX, e.originalEvent.clientY, color, height);

    // Screen shake
    document.getElementById('map').classList.add('screen-shake');
    setTimeout(function() { document.getElementById('map').classList.remove('screen-shake'); }, 300);

    // Flash
    var flash = document.createElement('div');
    flash.className = 'flash';
    document.body.appendChild(flash);
    setTimeout(function() { flash.remove(); }, 200);

    // Sound — procedural explosion scaled to building size
    generateExplosion(height);

    // Add rubble — dark building shell where the real one was
    if (geom && geom.type === 'Polygon') {
      rubbleFeatures.features.push({
        type: 'Feature',
        properties: { height: props.render_height || 30 },
        geometry: geom,
      });
      if (map.getSource('rubble')) {
        map.getSource('rubble').setData(rubbleFeatures);
      }
    }

    // Add fire at building center — 3D extruded box
    if (geom && geom.coordinates && geom.coordinates[0]) {
      var coords = geom.coordinates[0];
      var cx = 0, cy = 0;
      var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (var i = 0; i < coords.length; i++) {
        cx += coords[i][0]; cy += coords[i][1];
        if (coords[i][0] < minX) minX = coords[i][0];
        if (coords[i][0] > maxX) maxX = coords[i][0];
        if (coords[i][1] < minY) minY = coords[i][1];
        if (coords[i][1] > maxY) maxY = coords[i][1];
      }
      cx /= coords.length;
      cy /= coords.length;
      var boxSize = Math.max(maxX - minX, maxY - minY) * 0.35;

      fireLocations.push({
        lng: cx,
        lat: cy,
        baseH: Math.max(8, height * 0.35),
        boxSize: boxSize,
      });
    }

    // Score
    addScore(height, e.originalEvent.clientX, e.originalEvent.clientY);

    // Start ambient fire sound on first destruction
    if (destroyedCount === 0) startFireSound();

    // Hide cursor briefly for "impact" feel
    document.body.style.cursor = 'crosshair';
  });

  // ============================================================
  // CURSOR — show monster emoji on hover over buildings
  // ============================================================
  map.on('mousemove', function(e) {
    if (!map.getLayer('3d-buildings')) return;
    var features = map.queryRenderedFeatures(e.point, {
      layers: ['3d-buildings'],
    });
    document.body.style.cursor = features.length > 0 ? 'pointer' : 'crosshair';
  });
  </script>
</body>
</html>
