<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #map { width: 100vw; height: 100vh; }
    #map.satellite-mode canvas {
      filter: brightness(1.15) contrast(1.05) saturate(1.1);
    }

    .style-switcher {
      position: fixed;
      top: 12px;
      right: 60px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }
    .style-btn {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.15s;
      position: relative;
      background: #222;
    }
    .style-btn:hover { transform: scale(1.05); border-color: rgba(255,255,255,0.4); }
    .style-btn.active { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.4); }
    .style-btn .thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .style-btn .label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 9px;
      text-align: center;
      padding: 2px 0;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="style-switcher" id="styleSwitcher"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    var KEY = 'RaeBK7ZUPMGsXQd8JMzu';

    var STYLES = [
      { id: 'streets',   label: 'Streets',   style: 'https://api.maptiler.com/maps/streets-v2/style.json?key=' + KEY },
      { id: 'satellite', label: 'Satellite', style: 'https://api.maptiler.com/maps/satellite/style.json?key=' + KEY },
      { id: 'hybrid',    label: 'Hybrid',    style: 'https://api.maptiler.com/maps/hybrid/style.json?key=' + KEY },
      { id: 'topo',      label: 'Topo',      style: 'https://api.maptiler.com/maps/topo-v2/style.json?key=' + KEY },
      { id: 'outdoor',   label: 'Outdoor',   style: 'https://api.maptiler.com/maps/outdoor-v2/style.json?key=' + KEY },
      { id: 'basic',     label: 'Basic',     style: 'https://api.maptiler.com/maps/basic-v2/style.json?key=' + KEY },
    ];

    var currentStyleId = 'streets';

    var map = new maplibregl.Map({
      container: 'map',
      style: STYLES[0].style,
      center: [-73.9857, 40.7484],
      zoom: 14,
      pitch: 60,
      bearing: -20,
      maxZoom: 22,
      maxPitch: 85,
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

    map.on('styleimagemissing', function(e) {
      map.addImage(e.id, { width: 1, height: 1, data: new Uint8Array([0,0,0,0]) });
    });

    function add3DLayers() {
      if (!map.getSource('terrain')) {
        map.addSource('terrain', {
          type: 'raster-dem',
          url: 'https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=' + KEY,
        });
        map.setTerrain({ source: 'terrain', exaggeration: 1.5 });
      }

      if (!map.getSource('buildings')) {
        map.addSource('buildings', {
          type: 'vector',
          url: 'https://api.maptiler.com/tiles/v3/tiles.json?key=' + KEY,
        });
      }

      if (!map.getLayer('3d-buildings')) {
        map.addLayer({
          id: '3d-buildings',
          type: 'fill-extrusion',
          source: 'buildings',
          'source-layer': 'building',
          minzoom: 14,
          paint: {
            // Use real building colours from the tile data when available
            // Fall back to a height-based gradient for buildings without colour data
            'fill-extrusion-color': [
              'case',
              // Named CSS colours -> actual hex
              ['==', ['get', 'colour'], 'white'],    '#f0ece8',
              ['==', ['get', 'colour'], 'beige'],    '#e8dcc8',
              ['==', ['get', 'colour'], 'red'],      '#b55a5a',
              ['==', ['get', 'colour'], 'brown'],    '#8b6f5e',
              ['==', ['get', 'colour'], 'green'],    '#7a9a6d',
              ['==', ['get', 'colour'], 'black'],    '#3a3a3a',
              ['==', ['get', 'colour'], 'darkgray'], '#6b6b6b',
              ['==', ['get', 'colour'], 'lightgray'],'#d0d0d0',
              // Has a hex colour? Use it directly
              ['has', 'colour'],
                ['to-color', ['get', 'colour'], '#b0a89c'],
              // No colour data: shade by height
              [
                'interpolate', ['linear'], ['get', 'render_height'],
                0,   '#c8c0b4',
                30,  '#b0a89c',
                80,  '#9a9088',
                150, '#847c74',
                300, '#6e6862',
              ],
            ],
            'fill-extrusion-height': ['get', 'render_height'],
            'fill-extrusion-base': ['get', 'render_min_height'],
            // Add subtle vertical shading — darker at the base, lighter at top
            'fill-extrusion-opacity': 0.95,
          },
        });
      }
    }

    // Reduce terrain exaggeration at high zoom (tiles only go to z14)
    map.on('zoom', function() {
      var z = map.getZoom();
      var exag = z > 15 ? Math.max(0.3, 1.5 - (z - 15) * 0.25) : 1.5;
      if (map.getSource('terrain')) {
        map.setTerrain({ source: 'terrain', exaggeration: exag });
      }
    });

    map.on('load', add3DLayers);
    map.on('style.load', add3DLayers);

    // Style switcher
    var COLORS = { streets: '#4a90d9', satellite: '#1a1a2e', hybrid: '#2d5a27', topo: '#d4a843', outdoor: '#5a8f5a', basic: '#e8e8e8' };
    var ICONS  = { streets: '🏙️', satellite: '🛰️', hybrid: '🗺️', topo: '⛰️', outdoor: '🌲', basic: '📄' };

    var switcher = document.getElementById('styleSwitcher');
    STYLES.forEach(function(s, i) {
      var btn = document.createElement('div');
      btn.className = 'style-btn' + (i === 0 ? ' active' : '');

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.style.background = COLORS[s.id] || '#333';
      thumb.textContent = ICONS[s.id] || '🗺️';

      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = s.label;

      btn.appendChild(thumb);
      btn.appendChild(label);

      btn.addEventListener('click', function() {
        if (s.id === currentStyleId) return;
        currentStyleId = s.id;

        var center = map.getCenter();
        var zoom = map.getZoom();
        var pitch = map.getPitch();
        var bearing = map.getBearing();

        map.setStyle(s.style);

        map.once('style.load', function() {
          add3DLayers();
          map.setCenter(center);
          map.setZoom(zoom);
          map.setPitch(pitch);
          map.setBearing(bearing);
        });

        var mapEl = document.getElementById('map');
        if (s.id === 'satellite' || s.id === 'hybrid') {
          mapEl.classList.add('satellite-mode');
        } else {
          mapEl.classList.remove('satellite-mode');
        }

        document.querySelectorAll('.style-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });

      switcher.appendChild(btn);
    });
  </script>
</body>
</html>
